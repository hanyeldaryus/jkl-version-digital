{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h5 mb-3">Masuk ke sistem</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input class="d-none" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="form-label">Username</label>
      <input class="form-control mb-3" name="username" autofocus required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" required>
      <button class="btn btn-primary w-100">Masuk</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
