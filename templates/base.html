<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Kredit Digital{% endblock %} - PT. JKL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-jkl mb-4"><div class="container">
  <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">PT. JKL Kredit Digital</a>
  {% if current_user.is_authenticated %}
  <div class="text-white small d-flex align-items-center gap-2">
    <span>{{ current_user.nama }}</span><span class="badge bg-light text-dark">{{ current_user.role_label }}</span>
    <form method="post" action="{{ url_for('logout') }}" class="m-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-sm btn-outline-light">Keluar</button></form>
  </div>{% endif %}
</div></nav>
<main class="container pb-5">
  {% for c, m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main></body></html>
